name: E2E Playwright (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (Vite dev server)
        run: npx playwright test

      # Separate config: code-split chunks only exist in a real build, so the
      # dev-server run above cannot exercise them. Always runs, even if the
      # dev suite failed, so one report covers both layers.
      - name: Run Playwright tests (production build)
        if: '!cancelled()'
        run: npx playwright test --config=playwright.prod.config.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            playwright-report-prod
            test-results-prod
          if-no-files-found: ignore
