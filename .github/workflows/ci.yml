name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast standalone check - doesn't block or wait on the others
  lockfile-check:
    name: Lockfile Sync Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check lockfile is in sync with package.json
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          git fetch --depth=2 origin "$BASE" "$HEAD"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          if echo "$CHANGED" | grep -q '^package\.json$'; then
            if ! echo "$CHANGED" | grep -q '^package-lock\.json$'; then
              echo "::error::package.json was changed but package-lock.json was not updated. Run 'npm install' and commit the updated lockfile."
              exit 1
            fi
          fi

  # Lint, test, and build run in PARALLEL (independent jobs), not sequentially.
  # Each spends a few seconds extra on `npm ci`, but wall-clock time for the
  # whole pipeline is the length of the slowest job, not the sum of all three.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run build

  # Single required status check for branch protection, instead of configuring
  # four separate required checks. Treats "skipped" (lockfile-check on a push
  # event) as fine, and only fails on an actual job failure.
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lockfile-check, lint, test, build]
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::One or more required checks failed"
            exit 1
          fi
          echo "All required checks passed"
