<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AWS Student Builder Group at UH</title>
    <meta name="description" content="UH students building real AWS skills, earning certifications, and supporting each other through the cloud journey — for free." />
    <meta name="author" content="AWS Student Builder Group at University of Houston" />
    <meta name="robots" content="index, follow" />

    <!-- Mobile browser chrome color — matches --background token -->
    <meta name="theme-color" content="#110e1a" />
    <meta name="color-scheme" content="dark" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/aws-student-builder-group-logo.png" />
    <link rel="apple-touch-icon" href="/images/aws-student-builder-group-logo.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="AWS Student Builder Group at UH" />
    <meta property="og:description" content="UH students building real AWS skills, earning certifications, and supporting each other through the cloud journey — for free." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/aws-student-builder-group-logo.png" />

    <!-- Fonts: preconnect + preload trick so the stylesheet never blocks rendering.
         font-preload-swap.js swaps rel from preload→stylesheet once the CSS is
         fetched. It's a same-origin script (not an inline attribute) so CSP's
         script-src-attr 'none' default doesn't block it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="gfonts-preload"
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Figtree:wght@300;400;500;600;700&display=swap"
      as="style"
    />
    <script src="/font-preload-swap.js"></script>
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Figtree:wght@300;400;500;600;700&display=swap"
      />
    </noscript>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
